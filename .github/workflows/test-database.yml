# Keeps the test database (Neon branch lms-platform-test) up to date.
# Runs the migrations and the course import whenever lms-platform changes.
# Uses the TEST_DATABASE_URL secret only; it never touches the live database.
name: Update test database

on:
  push:
    branches: [lms-platform]
  workflow_dispatch:

concurrency:
  group: test-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the secret is set
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Add the TEST_DATABASE_URL secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/migrate.mjs
      - name: Import the course
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL }}
        run: npx tsx scripts/import-course.ts
